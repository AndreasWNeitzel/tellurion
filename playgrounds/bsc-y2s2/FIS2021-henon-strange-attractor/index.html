<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-slot="title">Henon Strange Attractor</title>
<link rel="stylesheet" href="../../../shared/css/tokens.css">
<link rel="stylesheet" href="../../../shared/css/base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { function tryRender(){ if (window.renderMathInElement && window.katex) renderMathInElement(document.body, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false }); else setTimeout(tryRender, 50); } tryRender(); });</script>
<style>
  body { padding: var(--space-4); }
  .pg-figure { max-width: 920px; position: relative; }
  .pg-figure canvas { width: 100%; height: auto; background: #060608; cursor: grab; display: block; }
  .pg-figure canvas.dragging { cursor: grabbing; }
  .readout-panel { position: absolute; top: 12px; left: 14px; background: rgba(6,6,8,0.55); padding: 8px 10px; border-radius: 4px; display: grid; grid-template-columns: 16ch 12ch; column-gap: 8px; row-gap: 2px; color: var(--fg-muted); font-family: var(--font-mono); font-size: 12px; pointer-events: auto; }
  .readout-panel .value { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
  figcaption { font-size: 13px; color: var(--fg-muted); margin-top: var(--space-2); }
  .pg-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3) var(--space-4); margin-block: var(--space-4); }
  .pg-controls .row { display: grid; grid-template-columns: 14ch 1fr 8ch; gap: var(--space-3); align-items: center; font-size: 13px; color: var(--fg-muted); }
  .pg-controls .row .value { font-family: var(--font-mono); text-align: right; color: var(--fg); }
  .pg-controls input[type="range"], .pg-controls select { width: 100%; }
  .pg-controls .row.buttons { grid-template-columns: 1fr 1fr; grid-column: span 2; }
</style></head><body>
<header>
  <h1 data-slot="title">Henon Strange Attractor</h1>
  <div data-slot="description" class="katex-target">The Henon map $x_{n+1} = 1 - a x_n^2 + y_n$, $y_{n+1} = b x_n$ folds the plane into a fractal strange attractor. Sweep $a$ and $b$ and watch the attractor reshape and lose stability; the live readout tracks the largest Lyapunov exponent.</div>
</header>
<figure class="pg-figure">
  <canvas id="stage" width="900" height="600"></canvas>
  <div id="readout" class="readout-panel" role="status" aria-live="polite"></div>
  <figcaption data-slot="caption" class="katex-target">Figure 1. Henon (1976) strange attractor; classic parameters a = 1.4, b = 0.3.</figcaption>
</figure>
<div id="controls" class="pg-controls">
  <div class="row"><span class="label">a</span><input type="range" id="slider-a" aria-label="a" min="1.0" max="1.45" step="0.005" value="1.4"><span class="value" id="value-a">1.400</span></div>
  <div class="row"><span class="label">b</span><input type="range" id="slider-b" aria-label="b" min="0.1" max="0.4" step="0.005" value="0.3"><span class="value" id="value-b">0.300</span></div>
  <div class="row"><span class="label">speed</span><input type="range" id="slider-speed" aria-label="iterations per frame" min="1" max="20" step="1" value="6"><span class="value" id="value-speed">6</span></div>
  <div class="row buttons">
    <button id="btn-reset" type="button">Reset</button>
    <button id="btn-playpause" type="button" aria-pressed="false">Pause</button>
  </div>
</div>
<div id="custom-controls"></div>
<script type="module" src="./playground.js"></script>
</body></html>

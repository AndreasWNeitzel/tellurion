<style>.pg-figure { max-width: 760px; } .pg-figure canvas { width: 100%; height: auto; background: #060608; } .pg-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3) var(--space-4); margin-block: var(--space-4); } .pg-controls .row { display: grid; grid-template-columns: 12ch 1fr 9ch; gap: var(--space-3); align-items: center; font-size: 13px; color: var(--fg-muted); } .pg-controls .row .value { font-family: var(--font-mono); text-align: right; color: var(--fg); } .pg-controls input[type="range"] { width: 100%; } .pg-controls select { width: 100%; }</style><link rel="stylesheet" href="../../../shared/css/explainer.css"></head><body>
<h1>Series convergence tests</h1>
<p><strong>What you are seeing:</strong> partial sums of four series with the geometric, ratio, and root tests applied. The accent curve is the partial sum; the dashed line is the limit (when finite).</p>
<figure class="pg-figure"><canvas id="stage" width="760" height="500"></canvas>
<div class="readout" id="readout" role="status" aria-live="polite"><span class="label">S_N:</span><span class="value" id="readout-s">0</span><span class="label">ratio rho:</span><span class="value" id="readout-r">0</span></div>
<figcaption><span class="figure-number">Figure 1.</span> Partial sums and the ratio/root convergence tests. Source: Arfken and Weber, Mathematical Methods for Physicists, Ch. 1.</figcaption></figure>
<div class="controls pg-controls" id="controls">
<div class="row"><span class="label">series</span><select aria-label="series" id="select-s"><option value="geom_half">geometric 1/2^n</option><option value="pseries_2" selected>p-series 1/n^2</option><option value="pseries_1">harmonic 1/n</option><option value="alt_log2">alternating (-1)^(n+1)/n</option></select><span class="value" id="value-s">pseries_2</span></div>
<div class="row"><span class="label">N</span><input aria-label="N" type="range" id="slider-N" min="2" max="200" step="1" value="40"><span class="value" id="value-N">40</span></div>
</div>
<script type="module" src="./playground.js"></script><script type="module" src="../../../shared/js/explainer.js"></script></body></html>

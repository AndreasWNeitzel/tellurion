<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exoplanet Interior</title>
<link rel="stylesheet" href="../../../shared/css/tokens.css">
<link rel="stylesheet" href="../../../shared/css/base.css">
<link rel="stylesheet" href="../../../shared/css/playground-v2.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { function tryRender(){ if (window.renderMathInElement && window.katex) renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]}); else setTimeout(tryRender, 50); } tryRender(); });</script>
<style>
  body { padding: var(--space-4); }
  .pg-figure { max-width: 860px; position: relative; }
  .pg-figure canvas { width: 100%; height: auto; background: #07080c; display: block; border-radius: 4px; }
  .readout-panel { margin-top: var(--space-3); background: rgba(8,10,14,0.7); padding: 10px 14px; border-radius: 4px; display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 14px; row-gap: 4px; color: var(--fg-muted); font-family: var(--font-mono); font-size: 12px; }
  .readout-panel .label { color: var(--fg-muted); font-size: 11px; opacity: 0.75; }
  .readout-panel .value { color: var(--fg); font-variant-numeric: tabular-nums; padding-bottom: 4px; }
  figcaption { font-size: 13px; color: var(--fg-muted); margin-top: var(--space-2); }
  .pg-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3) var(--space-4); margin-block: var(--space-4); }
  .pg-controls .row { display: grid; grid-template-columns: 14ch 1fr 8ch; gap: var(--space-2); align-items: center; font-size: 13px; color: var(--fg-muted); }
  .pg-controls .row .value { font-family: var(--font-mono); text-align: right; color: var(--fg); }
  .pg-controls input[type="range"], .pg-controls select { width: 100%; }
  .pg-controls .row.buttons { grid-template-columns: 1fr 1fr 1fr; grid-column: span 2; gap: var(--space-3); }
</style>
<link rel="stylesheet" href="../../../shared/css/explainer.css">
</head>
<body>
<main class="playground-layout" data-focus="false">

  <a href="/" class="playground-back" aria-label="Back to catalog">
    <svg class="back-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    <span class="back-title">Exoplanet Interior</span>
  </a>

  <article class="playground-center">

    <header class="playground-header">
      <h1 class="t-title playground-title">Exoplanet Interior</h1>
    </header>

    <section class="playground-intro">
      <p class="t-body">Exoplanet Interior.</p>
    </section>

    <div class="playground-canvas-frame">
      <button class="playground-focus-toggle" aria-label="Enter focus mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
      </button>
      <canvas class="playground-canvas" id="stage" width="900" height="680"></canvas>
    </div>

    <figcaption class="t-small playground-caption">Figure 1. Layered planet cutaway with the mass-radius curve and pressure profile. Source: Seager et al. ApJ 669 (2007) 1279 (`seager-massradius`); Zapolsky and Salpeter ApJ 158 (1969) 809 (`zapolsky-salpeter`).</figcaption>

    <section class="playground-controls">
      <div id="controls" class="pg-controls"></div>
      <div class="v2-legacy" hidden><div id="readout" class="readout-panel" role="status" aria-live="polite"></div></div>
    </section>

    <section class="playground-what-to-try">
      <h2 class="t-label">WHAT TO TRY</h2>
      <ul>
        <li class="t-body">Vary each control and watch the rail readouts respond.</li>
        <li class="t-body">Compare the diagnostic plot against the live scene.</li>
      </ul>
    </section>

  </article>

  <aside class="playground-rail" aria-label="Diagnostics">
    <section class="rail-state">
      <h2 class="t-label">LIVE READOUTS</h2>
      <table class="rail-state-table"></table>
    </section>
    <section class="rail-invariants">
      <h2 class="t-label">INVARIANTS</h2>
      <ul class="rail-invariants-list"></ul>
    </section>
    <section class="rail-references">
      <h2 class="t-label">REFERENCES</h2>
      <ol class="rail-references-list"></ol>
    </section>
  </aside>

</main>
<script type="module" src="../../../shared/js/rail.js"></script>
<script type="module" src="../../../shared/js/focus.js"></script>
<script type="module" src="./playground.js"></script>
<script type="module" src="../../../shared/js/explainer.js"></script>
</body>
</html>

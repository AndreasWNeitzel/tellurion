<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jaynes-Cummings Model: Collapse and Revival</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../../shared/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../../shared/css/explainer.css"><style>
  .pg-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3) var(--space-4); margin-block: var(--space-4); }
  .pg-controls .row { display: grid; grid-template-columns: 16ch 1fr 8ch; gap: var(--space-3); align-items: center; font-size: 13px; color: var(--fg-muted); }
  .pg-controls .row .value { font-family: var(--font-mono); text-align: right; color: var(--fg); }
  .pg-controls input[type="range"], .pg-controls select { width: 100%; }
  .pg-controls .row.buttons { grid-template-columns: 1fr 1fr 1fr; grid-column: span 2; }
</style>
</head>
<body>
  <h1>Jaynes-Cummings Model: Collapse and Revival</h1>

  <figure>
    <canvas id="stage" width="900" height="560" aria-label="Jaynes-Cummings inversion, photon distribution and field phase space"></canvas>
    <div class="readout" id="readout" role="status" aria-live="polite">
      <span class="label">t:</span><span class="value" id="readout-t">0.00</span>
      <span class="label">W(t):</span><span class="value" id="readout-w">+1.000</span>
      <span class="label">P_e:</span><span class="value" id="readout-pe">1.000</span>
      <span class="label">t_c:</span><span class="value" id="readout-tc">1.41</span>
      <span class="label">t_r:</span><span class="value" id="readout-tr">31.42</span>
    </div>
    <figcaption>
      <span class="figure-number">Figure 1.</span>
      Resonant Jaynes-Cummings dynamics of a two-level atom in a single cavity mode: the atomic inversion collapses on the frequency-spread time and revives at t_r = 2 pi sqrt(nbar) / g for a coherent field, alongside the Poissonian photon distribution and the field phase-space (Wigner) blob.
      <em>Method:</em> exact closed-form sum W(t) = sum_n P(n) cos(2 g t sqrt(n+1)), deterministic, no integration.
      <em>Source:</em> Jaynes and Cummings 1963; Eberly, Narozhny and Sanchez-Mondragon 1980; Gerry and Knight 2005.
    </figcaption>
  </figure>

  <div class="controls pg-controls" id="controls" role="group" aria-label="Simulation controls">
    <div class="row"><span class="label">mean photons nbar</span><input aria-label="mean photon number, x10" type="range" id="slider-nbar" min="0" max="800" step="5" value="250"><span class="value" id="value-nbar">25.0</span></div>
    <div class="row"><span class="label">coupling g</span><input aria-label="atom-field coupling, x100" type="range" id="slider-g" min="50" max="200" step="5" value="100"><span class="value" id="value-g">1.00</span></div>
    <div class="row buttons"><button id="btn-reset" type="button">Reset</button><button id="btn-pause" type="button" aria-pressed="false">Pause</button><span id="share-mount"></span></div>
  </div>

  <script type="module" src="./playground.js"></script>
<script type="module" src="../../../shared/js/explainer.js"></script></body>
</html>

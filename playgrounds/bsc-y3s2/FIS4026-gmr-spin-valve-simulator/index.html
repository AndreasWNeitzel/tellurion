<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spin Valve: GMR/TMR Hysteresis and the Two-Current Model</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../../shared/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../../shared/css/explainer.css"></head>
<body>
  <h1>Spin Valve: GMR/TMR Hysteresis and the Two-Current Model</h1>

  <figure>
    <canvas id="stage" width="860" height="560" aria-label="Magnetoresistance hysteresis loop, spin-valve stack, and the model curve"></canvas>
    <div class="readout" id="readout" role="status" aria-live="polite">
      <span class="label">H:</span><span class="value" id="readout-h">+1.60</span>
      <span class="label">state:</span><span class="value" id="readout-state">parallel</span>
      <span class="label">R/R_P:</span><span class="value" id="readout-r">1.00</span>
      <span class="label">MR:</span><span class="value" id="readout-mr">0%</span>
    </div>
    <figcaption>
      <span class="figure-number">Figure 1.</span>
      A spin valve: sweeping the applied field flips the soft free layer at its coercive field while the pinned layer stays fixed, so the stack toggles between the low-resistance parallel state and the high-resistance antiparallel state, tracing a hysteretic magnetoresistance loop set by the two-current (GMR) or Julliere (TMR) model.
      <em>Method:</em> two-current series-resistor GMR and Julliere TMR, hysteretic free/pinned switching; deterministic.
      <em>Source:</em> Mott 1936; Julliere 1975; Baibich et al. 1988; Dieny et al. 1991.
    </figcaption>
  </figure>

  <div class="controls" id="controls" role="group" aria-label="Simulation controls">
    <div class="row"><span class="label">model</span><select aria-label="magnetoresistance model" id="select-model" style="grid-column: span 2;"><option value="gmr">GMR (two-current, metallic spacer)</option><option value="tmr">TMR (Julliere, tunnel barrier)</option></select></div>
    <div class="row"><span class="label">spin polarization P</span><input aria-label="spin polarization, x100" type="range" id="slider-p" min="5" max="95" step="1" value="50"><span class="value" id="value-p">0.50</span></div>
    <div class="row"><span class="label">free-layer Hc</span><input aria-label="free layer coercive field, x100" type="range" id="slider-hc" min="5" max="90" step="1" value="30"><span class="value" id="value-hc">0.30</span></div>
    <div class="row buttons"><button id="btn-reset" type="button">Reset</button><button id="btn-pause" type="button" aria-pressed="false">Pause</button><span id="share-mount"></span></div>
  </div>

  <script type="module" src="./playground.js"></script>
<script type="module" src="../../../shared/js/explainer.js"></script></body>
</html>

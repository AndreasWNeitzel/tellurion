<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Distance Ladder</title>
<link rel="stylesheet" href="../../../shared/css/tokens.css"><link rel="stylesheet" href="../../../shared/css/base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { function tryRender(){ if (window.renderMathInElement && window.katex) renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]}); else setTimeout(tryRender, 50); } tryRender(); });</script>
<style>.pg-figure { max-width: 760px; } .pg-figure canvas { width: 100%; height: auto; background: #060608; } .pg-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3) var(--space-4); margin-block: var(--space-4); } .pg-controls .row { display: grid; grid-template-columns: 14ch 1fr 8ch; gap: var(--space-3); align-items: center; font-size: 13px; color: var(--fg-muted); } .pg-controls .row .value { font-family: var(--font-mono); text-align: right; color: var(--fg); } .pg-controls input[type="range"] { width: 100%; } .pg-controls .row.buttons { grid-template-columns: 1fr 1fr; grid-column: span 2; }</style></head><body>
<h1>Cosmic distance ladder</h1>
<p><strong>What you are seeing:</strong> four overlapping methods spanning 11 orders of magnitude in distance. Each rung calibrates the next; errors compound along the chain. Source: Carroll-Ostlie Ch. 24 (`carroll-ostlie`).</p>
<figure class="pg-figure"><canvas id="stage" width="760" height="500"></canvas>
<div class="readout" id="readout" role="status" aria-live="polite"><span class="label">σ ladder:</span><span class="value" id="readout-s">5%</span></div>
<figcaption><span class="figure-number">Figure 1.</span> Distance ladder with method overlap and accumulated uncertainty. Source: Carroll-Ostlie Ch. 24 (`carroll-ostlie`).</figcaption></figure>
<div class="controls pg-controls" id="controls">
<div class="row"><span class="label">σ parallax</span><input aria-label="σ parallax" type="range" id="slider-s1" min="0.005" max="0.2" step="0.005" value="0.02"><span class="value" id="value-s1">2.0%</span></div>
<div class="row"><span class="label">σ cepheid</span><input aria-label="σ cepheid" type="range" id="slider-s2" min="0.01" max="0.2" step="0.005" value="0.05"><span class="value" id="value-s2">5.0%</span></div>
<div class="row"><span class="label">σ SN Ia</span><input aria-label="σ SN Ia" type="range" id="slider-s3" min="0.01" max="0.2" step="0.005" value="0.06"><span class="value" id="value-s3">6.0%</span></div>
<div class="row buttons"><button id="btn-reset" type="button">Reset</button><button id="btn-pause" type="button" aria-pressed="false">Pause</button></div>
</div>
<script type="module" src="./playground.js"></script></body></html>

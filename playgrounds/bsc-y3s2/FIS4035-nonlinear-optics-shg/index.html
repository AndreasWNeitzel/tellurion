<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second-Harmonic Generation: Phase Matching and Conversion</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../../shared/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../../shared/css/explainer.css"></head>
<body>
  <h1>Second-Harmonic Generation: Phase Matching and Conversion</h1>

  <figure>
    <canvas id="stage" width="860" height="560" aria-label="SHG intensity along the crystal, phase-matching acceptance, and BBO dispersion"></canvas>
    <div class="readout" id="readout" role="status" aria-live="polite">
      <span class="label">dk:</span><span class="value" id="readout-dk">0.00</span>
      <span class="label">L_c:</span><span class="value" id="readout-lc">inf</span>
      <span class="label">eta:</span><span class="value" id="readout-eta">0.000</span>
      <span class="label">BBO theta_pm:</span><span class="value" id="readout-tpm">22.78</span>
    </div>
    <figcaption>
      <span class="figure-number">Figure 1.</span>
      Second-harmonic generation in a chi(2) crystal: undepleted SHG grows as z^2 only at perfect phase matching and otherwise oscillates within one coherence length, while with pump depletion the phase-matched conversion saturates as tanh^2; the sinc^2 acceptance and the beta-BBO type-I phase-matching angle are shown alongside.
      <em>Method:</em> closed-form coupled-wave solutions (undepleted sinc^2 and exact phase-matched tanh^2), beta-BBO Sellmeier; deterministic.
      <em>Source:</em> Armstrong, Bloembergen, Ducuing and Pershan 1962; Boyd, Nonlinear Optics 2008, Ch. 2; Eimerl et al. 1987.
    </figcaption>
  </figure>

  <div class="controls" id="controls" role="group" aria-label="Simulation controls">
    <div class="row"><span class="label">regime</span><select aria-label="conversion regime" id="select-regime" style="grid-column: span 2;"><option value="undepleted">undepleted (sinc^2 / coherence length)</option><option value="depleted">phase-matched, pump depletion (tanh^2)</option></select></div>
    <div class="row"><span class="label">phase mismatch dk</span><input aria-label="phase mismatch, x100 per micron" type="range" id="slider-dk" min="0" max="300" step="2" value="60"><span class="value" id="value-dk">0.60</span></div>
    <div class="row"><span class="label">coupling gamma</span><input aria-label="nonlinear coupling, x100" type="range" id="slider-gamma" min="2" max="120" step="1" value="6"><span class="value" id="value-gamma">0.06</span></div>
    <div class="row buttons"><button id="btn-reset" type="button">Reset</button><button id="btn-pause" type="button" aria-pressed="false">Pause</button><span id="share-mount"></span></div>
  </div>

  <script type="module" src="./playground.js"></script>
<script type="module" src="../../../shared/js/explainer.js"></script></body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravitational Waves: Inspiral, Merger, and Detection</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../../shared/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../../shared/css/explainer.css"></head>
<body>
  <h1>Gravitational Waves: Inspiral, Merger, and Detection</h1>

  <figure>
    <canvas id="stage" width="860" height="560" aria-label="two black holes spiralling to merger and the radiated gravitational-wave ripple, with the chirp strain, matched filter, and LIGO arm strain"></canvas>
    <div class="readout" id="readout" role="status" aria-live="polite">
      <span class="label">M_chirp:</span><span class="value" id="readout-mc">26.1</span>
      <span class="label">f_GW:</span><span class="value" id="readout-f">0</span>
      <span class="label">h_peak:</span><span class="value" id="readout-h">0</span>
      <span class="label">MF SNR:</span><span class="value" id="readout-snr">0</span>
    </div>
    <figcaption>
      <span class="figure-number">Figure 1.</span>
      Two black holes spiral together on a shrinking orbit and radiate a two-arm gravitational-wave ripple that tightens into the merger and rings down; the chirp strain, a matched filter that recovers the chirp mass, and a LIGO arm changing length by h L / 2 (a sub-proton displacement) are shown as diagnostics.
      <em>Method:</em> Keplerian inspiral with leading-quadrupole radiation, the chirp-mass frequency sweep, antenna response, and matched filtering; Canvas2D, deterministic.
      <em>Source:</em> Peters 1964; Maggiore, Gravitational Waves Vol. 1; Abbott et al. 2016.
    </figcaption>
  </figure>

  <div class="controls" id="controls" role="group" aria-label="Simulation controls">
    <div class="row"><span class="label">m1 (Msun)</span><input aria-label="primary mass, solar masses" type="range" id="slider-m1" min="5" max="80" step="1" value="30"><span class="value" id="value-m1">30</span></div>
    <div class="row"><span class="label">m2 (Msun)</span><input aria-label="secondary mass, solar masses" type="range" id="slider-m2" min="5" max="80" step="1" value="30"><span class="value" id="value-m2">30</span></div>
    <div class="row"><span class="label">distance (Mpc)</span><input aria-label="luminosity distance, Mpc" type="range" id="slider-d" min="50" max="1500" step="10" value="400"><span class="value" id="value-d">400</span></div>
    <div class="row buttons"><button id="btn-reset" type="button">Reset</button><button id="btn-pause" type="button" aria-pressed="false">Pause</button><span id="share-mount"></span></div>
  </div>

  <script type="module" src="./playground.js"></script>
<script type="module" src="../../../shared/js/explainer.js"></script></body>
</html>
